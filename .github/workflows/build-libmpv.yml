name: Build libmpv (gpu-next render backend)

on:
  push:
    branches: [gpu-next-render-backend]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # mpv master needs FFmpeg >=60.31; ubuntu-22.04 only has 58.x.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-noble-v1-${{ hashFiles('.github/workflows/build-libmpv.yml') }}
          restore-keys: apt-noble-v1-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo sed -i 's|mirror://mirrors.ubuntu.com/mirrors.txt|http://archive.ubuntu.com/ubuntu/|; s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          mkdir -p ~/.apt-cache
          sudo apt-get update
          sudo apt-get -o Dir::Cache::Archives="$HOME/.apt-cache" install --no-install-recommends -y \
            ninja-build pkg-config python3-pip patchelf \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libass-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libxext-dev \
            libvulkan-dev
          sudo chown -R "$(id -u):$(id -g)" ~/.apt-cache
          # --preserve-env=HOME so pip's cache hits the runner's home, not root's.
          sudo --preserve-env=HOME pip install meson

      - name: Cache libplacebo build
        id: cache-libplacebo
        uses: actions/cache@v4
        with:
          path: /tmp/libplacebo-install
          key: libplacebo-v7.360.1-${{ runner.os }}

      - name: Build libplacebo
        if: steps.cache-libplacebo.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v7.360.1 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo
          cd /tmp/libplacebo
          git submodule update --init --depth 1
          meson setup build -Dvulkan=disabled -Ddemos=false --prefix=/tmp/libplacebo-install
          ninja -C build
          ninja -C build install

      - name: Install libplacebo
        run: |
          sudo cp -a /tmp/libplacebo-install/. /usr/
          sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-linux
          create-symlink: true

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Download linuxdeploy
        run: |
          curl -fL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Package
        run: |
          mkdir -p AppDir/usr/lib
          cp -L build/libmpv.so.2.5.0 AppDir/usr/lib/

          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir=AppDir \
            --library=AppDir/usr/lib/libmpv.so.2.5.0

          mkdir -p out
          cp -aL AppDir/usr/lib/. out/
          ln -sf libmpv.so.2.5.0 out/libmpv.so.2
          ln -sf libmpv.so.2 out/libmpv.so

          for f in out/*.so*; do
            [ -L "$f" ] && continue
            patchelf --set-rpath '$ORIGIN' "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-linux-x86_64
          path: out/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config ffmpeg libass libplacebo dylibbundler ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-macos
          create-symlink: true

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.2.dylib out/libmpv.dylib
          # Bundle Homebrew's dynamic deps so this works outside this machine.
          dylibbundler --bundle-deps --fix-file out/libmpv.dylib \
            --dest-dir out/ --install-path @rpath/ --overwrite-files

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-macos-universal
          path: out/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-lua51

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp build/mpv-2.dll out/ 2>/dev/null || cp build/libmpv-2.dll out/mpv-2.dll
          # Bundle MSYS2's dynamic deps; loop since ldd only lists direct ones.
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for f in out/*.dll; do
              for dep in $(ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'); do
                base="$(basename "$dep")"
                if [ ! -f "out/$base" ]; then
                  cp "$dep" "out/$base"
                  added=$((added + 1))
                fi
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-windows-x86_64
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's output
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Build release notes from commits
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)"
          RANGE="${PREV_TAG:+$PREV_TAG..}${{ github.ref_name }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          : > notes.md
          git log "$RANGE" --pretty=format:"%h%x09%s" | while IFS=$'\t' read -r hash subject; do
            clean="$(sed -E 's/^[a-zA-Z]+(\([^)]*\))?: //; s/^(.)/\U\1/' <<< "$subject")"
            echo "- $clean ([$hash]($REPO_URL/commit/$hash))" >> notes.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body_path: notes.md
