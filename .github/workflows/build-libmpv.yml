name: Build libmpv (gpu-next render backend)

on:
  push:
    branches: [gpu-next-render-backend, integrated]
    tags: ["v*"]
  workflow_dispatch:

env:
  VULKAN_SDK_TAG: "vulkan-sdk-1.4.363.0"
  LIBPLACEBO_REV: "master"

jobs:
  linux:
    # mpv master needs FFmpeg >=60.31; ubuntu-22.04 only has 58.x.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-noble-v1-${{ hashFiles('.github/workflows/build-libmpv.yml') }}
          restore-keys: apt-noble-v1-

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-meson-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo sed -i 's|mirror://mirrors.ubuntu.com/mirrors.txt|http://archive.ubuntu.com/ubuntu/|; s|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          mkdir -p ~/.apt-cache
          sudo apt-get update
          sudo apt-get -o Dir::Cache::Archives="$HOME/.apt-cache" install --no-install-recommends -y \
            ninja-build pkg-config python3-pip patchelf \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libluajit-5.1-dev \
            libass-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libxext-dev libxrandr-dev libxcb1-dev \
            libvulkan-dev glslang-tools libshaderc-dev
          sudo chown -R "$(id -u):$(id -g)" ~/.apt-cache
          # --preserve-env=HOME so pip's cache hits the runner's home, not root's.
          sudo --preserve-env=HOME pip install meson

      - name: Install Vulkan headers and loader
        run: |
          for repo in Vulkan-Headers Vulkan-Loader; do
            git clone --depth 1 --branch "$VULKAN_SDK_TAG" "https://github.com/KhronosGroup/$repo.git" "/tmp/$repo"
            cmake -S "/tmp/$repo" -B "/tmp/$repo/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR=lib
            sudo cmake --build "/tmp/$repo/build" --target install
          done
          sudo ldconfig
          pkg-config --exact-version="${VULKAN_SDK_TAG#vulkan-sdk-}" vulkan || pkg-config --modversion vulkan

      - name: Build libplacebo
        run: |
          git clone --filter=blob:none https://github.com/haasn/libplacebo.git /tmp/libplacebo
          cd /tmp/libplacebo
          git checkout "$LIBPLACEBO_REV"
          git submodule update --init --depth 1
          git apply "$GITHUB_WORKSPACE/third_party/libplacebo-sampler-rect.patch"
          meson setup build -Dtests=true -Dvulkan=enabled -Ddemos=false --prefix=/tmp/libplacebo-install
          ninja -C build
          meson test -C build --print-errorlogs
          ninja -C build install

      - name: Install libplacebo
        run: |
          sudo cp -a /tmp/libplacebo-install/. /usr/
          sudo ldconfig

      - name: Install nv-codec-headers
        run: |
          git clone --depth 1 --branch n12.2.72.0 https://github.com/FFmpeg/nv-codec-headers.git /tmp/nv-codec-headers
          sudo make -C /tmp/nv-codec-headers install

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-linux
          create-symlink: true

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false -Dvulkan=enabled -Dcuda-hwaccel=enabled -Dcuda-interop=enabled
          ninja -C build
          grep -q "List of enabled features:.*vulkan" build/meson-logs/meson-log.txt

      - name: Download linuxdeploy
        run: |
          curl -fL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Package
        run: |
          LIBMPV="$(basename "$(ls build/libmpv.so.2.*.* | head -n 1)")"
          mkdir -p AppDir/usr/lib
          cp -L "build/$LIBMPV" AppDir/usr/lib/

          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir=AppDir \
            --library="AppDir/usr/lib/$LIBMPV"

          mkdir -p out
          cp -aL AppDir/usr/lib/. out/
          ln -sf "$LIBMPV" out/libmpv.so.2
          ln -sf libmpv.so.2 out/libmpv.so

          for f in out/*.so*; do
            [ -L "$f" ] && continue
            patchelf --set-rpath '$ORIGIN' "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-linux-x86_64
          path: out/

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config ffmpeg libass xxhash dav1d dylibbundler ccache molten-vk vulkan-loader vulkan-headers

      - name: Build patched libplacebo
        run: |
          export XXHASH_PREFIX="$(brew --prefix xxhash)"
          export DAV1D_PREFIX="$(brew --prefix dav1d)"
          export CPPFLAGS="-I${XXHASH_PREFIX}/include -I${DAV1D_PREFIX}/include ${CPPFLAGS:-}"
          export LDFLAGS="-L${XXHASH_PREFIX}/lib -L${DAV1D_PREFIX}/lib ${LDFLAGS:-}"
          echo "Using xxhash from ${XXHASH_PREFIX}"
          echo "Using dav1d from ${DAV1D_PREFIX}"
          git clone --filter=blob:none https://github.com/haasn/libplacebo.git /tmp/libplacebo
          cd /tmp/libplacebo
          git checkout "$LIBPLACEBO_REV"
          git submodule update --init --depth 1
          git apply "$GITHUB_WORKSPACE/third_party/libplacebo-sampler-rect.patch"
          meson setup build -Dtests=true -Ddemos=false -Dopengl=enabled -Dvulkan=enabled -Dprefix=/tmp/libplacebo-install
          meson compile -C build
          meson install -C build
          export PKG_CONFIG_PATH="/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          tests="$(meson test -C build --list | grep -Ev '^libplacebo:(vulkan|compositor)\.c$')"
          meson test -C build --print-errorlogs $tests
          echo "PKG_CONFIG_PATH=/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/tmp/libplacebo-install/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/tmp/libplacebo-install/include" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-macos
          create-symlink: true

      - name: Build mpv
        run: |
          export PKG_CONFIG_PATH="/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          meson setup build -Dlibmpv=true -Dgpl=false -Dvideotoolbox-gl=enabled
          meson introspect --dependencies build
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          ninja -C build
          otool -L build/libmpv.2.dylib
          otool -L /tmp/libplacebo-install/lib/libplacebo*.dylib
          otool -L build/libmpv.2.dylib | grep -F libplacebo

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.2.dylib out/libmpv.dylib
          dylibbundler --bundle-deps --fix-file out/libmpv.dylib \
            --dest-dir out/ --install-path @loader_path/ --overwrite-files
          cp -L "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" out/
          ls out/libplacebo*.dylib

      - name: Verify portable libraries
        run: |
          test -f out/libmpv.dylib
          test -f out/libMoltenVK.dylib
          for dylib in out/*.dylib; do
            file "$dylib"
            otool -L "$dylib"
            architectures="$(lipo -archs "$dylib")"
            echo "$dylib: $architectures"
            echo "$architectures" | grep -qw "${{ matrix.architecture }}"
            if otool -arch "${{ matrix.architecture }}" -L "$dylib" | tail -n +3 | grep -Eq '(/opt/homebrew/|/usr/local/|/tmp/libplacebo-install/)'; then
              echo "non-portable dependency found in $dylib" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-macos-${{ matrix.architecture }}
          path: out/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Cache MSYS2 package downloads
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/build-libmpv.yml') }}
          restore-keys: msys2-pacman-${{ runner.os }}-

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-lua51
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-nasm

      - name: Build mpv
        run: |
          # angleproject only supplies headers here; egl-angle-lib stays
          # disabled so libmpv-2.dll keeps loading libEGL.dll dynamically
          # at runtime instead of hard-requiring it just to load.
          # vulkan=enabled makes the build fail instead of silently dropping
          # MPV_RENDER_API_TYPE_VULKAN, which fluxa-desktop asks for on Windows.
          meson setup build -Dlibmpv=true -Dgpl=false -Degl-angle-lib=disabled -Dvulkan=enabled
          ninja -C build

      - name: Check render API features
        run: |
          meson introspect build --buildoptions | grep -A2 '"name": "vulkan"' || true
          grep -E "vulkan|d3d11-gpu-next" build/meson-logs/meson-log.txt | head -20
          strings build/mpv-2.dll 2>/dev/null | grep -q 'List of enabled features:.*vulkan' || \
            strings build/libmpv-2.dll | grep -q 'List of enabled features:.*vulkan'

      - name: Package
        run: |
          mkdir -p out
          cp build/mpv-2.dll out/ 2>/dev/null || cp build/libmpv-2.dll out/mpv-2.dll
          # Bundle MSYS2's dynamic deps; loop since ldd only lists direct ones.
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for f in out/*.dll; do
              for dep in $(ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'); do
                base="$(basename "$dep")"
                if [ ! -f "out/$base" ]; then
                  cp "$dep" "out/$base"
                  added=$((added + 1))
                fi
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-windows-x86_64
          path: out/

  apple-xcframework:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install -q meson nasm pkgconf

      - uses: actions/cache@v4
        with:
          path: ios-build
          key: deps-apple-${{ hashFiles('ci/apple-native/build-ios.sh') }}

      - name: Build libmpv for every Apple SDK
        run: |
          for sdk in iphoneos iphonesimulator appletvos appletvsimulator; do
            rm -rf "ios-build/$sdk/mpv"
            ci/apple-native/build-ios.sh "$sdk"
          done

      - name: Create xcframework
        run: |
          args=""
          for sdk in iphoneos iphonesimulator appletvos appletvsimulator; do
            args="$args -library ios-build/$sdk/out/libmpv.a -headers ios-build/$sdk/out/include"
          done
          mkdir -p out-xcframework
          xcodebuild -create-xcframework $args -output out-xcframework/Libmpv.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-apple.xcframework
          path: out-xcframework/

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS desktop dependencies
        run: |
          brew install meson ninja pkg-config ffmpeg libass xxhash dav1d dylibbundler ccache molten-vk vulkan-loader vulkan-headers

      - name: Build patched libplacebo
        run: |
          export XXHASH_PREFIX="$(brew --prefix xxhash)"
          export DAV1D_PREFIX="$(brew --prefix dav1d)"
          export CPPFLAGS="-I${XXHASH_PREFIX}/include -I${DAV1D_PREFIX}/include ${CPPFLAGS:-}"
          export LDFLAGS="-L${XXHASH_PREFIX}/lib -L${DAV1D_PREFIX}/lib ${LDFLAGS:-}"
          echo "Using xxhash from ${XXHASH_PREFIX}"
          echo "Using dav1d from ${DAV1D_PREFIX}"
          git clone --filter=blob:none https://github.com/haasn/libplacebo.git /tmp/libplacebo
          cd /tmp/libplacebo
          git checkout "$LIBPLACEBO_REV"
          git submodule update --init --depth 1
          git apply "$GITHUB_WORKSPACE/third_party/libplacebo-sampler-rect.patch"
          meson setup build -Dtests=true -Ddemos=false -Dopengl=enabled -Dvulkan=enabled -Dprefix=/tmp/libplacebo-install
          meson compile -C build
          meson install -C build
          export PKG_CONFIG_PATH="/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          tests="$(meson test -C build --list | grep -Ev '^libplacebo:(vulkan|compositor)\.c$')"
          meson test -C build --print-errorlogs $tests
          echo "PKG_CONFIG_PATH=/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/tmp/libplacebo-install/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I/tmp/libplacebo-install/include" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-macos
          create-symlink: true

      - name: Build mpv
        run: |
          export PKG_CONFIG_PATH="/tmp/libplacebo-install/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          meson setup build -Dlibmpv=true -Dgpl=false -Dvideotoolbox-gl=enabled
          meson introspect --dependencies build
          test "$(pkg-config --variable=prefix libplacebo)" = /tmp/libplacebo-install
          ninja -C build
          otool -L build/libmpv.2.dylib
          otool -L /tmp/libplacebo-install/lib/libplacebo*.dylib
          otool -L build/libmpv.2.dylib | grep -F libplacebo

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.2.dylib out/libmpv.dylib
          dylibbundler --bundle-deps --fix-file out/libmpv.dylib \
            --dest-dir out/ --install-path @loader_path/ --overwrite-files
          cp -L "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" out/
          ls out/libplacebo*.dylib

      - name: Verify portable libraries
        run: |
          test -f out/libmpv.dylib
          test -f out/libMoltenVK.dylib
          for dylib in out/*.dylib; do
            file "$dylib"
            otool -L "$dylib"
            architectures="$(lipo -archs "$dylib")"
            echo "$dylib: $architectures"
            echo "$architectures" | grep -qw "arm64"
            if otool -arch "arm64" -L "$dylib" | tail -n +3 | grep -Eq '(/opt/homebrew/|/usr/local/|/tmp/libplacebo-install/)'; then
              echo "non-portable dependency found in $dylib" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-macos-arm64
          path: out/


  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm pkg-config gcc-multilib

      - name: Install Rust targets and cargo-c
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-c --locked

      - uses: actions/cache@v4
        with:
          path: android-build/${{ matrix.abi }}
          key: android-${{ matrix.abi }}-${{ hashFiles('ci/android/build.sh', 'third_party/*.patch') }}

      - name: Build libmpv
        env:
          ABI: ${{ matrix.abi }}
          WORK: ${{ github.workspace }}/android-build/${{ matrix.abi }}
        run: |
          rm -rf "$WORK/mpv"
          ci/android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: android-build/${{ matrix.abi }}/out/

  android-bundle:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: abis

      - name: Merge ABIs
        run: |
          mkdir -p out
          for dir in abis/android-*; do
            cp -r "$dir"/. out/
          done
          find out -type f

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-android
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, apple-xcframework, macos-arm64, android-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: libmpv-*
          path: artifacts

      - name: Zip each platform's output
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Build release notes from commits
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)"
          RANGE="${PREV_TAG:+$PREV_TAG..}${{ github.ref_name }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          : > notes.md
          git log "$RANGE" --pretty=format:"%h%x09%s" | while IFS=$'\t' read -r hash subject; do
            clean="$(sed -E 's/^[a-zA-Z]+(\([^)]*\))?: //; s/^(.)/\U\1/' <<< "$subject")"
            echo "- $clean ([$hash]($REPO_URL/commit/$hash))" >> notes.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body_path: notes.md
