name: Build libmpv (gpu-next render backend)

on:
  push:
    branches: [gpu-next-render-backend]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # mpv master needs FFmpeg >=60.31; ubuntu-22.04 only has 58.x.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ninja-build pkg-config python3-pip patchelf \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libass-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libxext-dev \
            libvulkan-dev
          # System-wide: `ninja install` re-invokes meson under sudo.
          sudo pip install meson

      - name: Cache libplacebo build
        id: cache-libplacebo
        uses: actions/cache@v4
        with:
          path: /tmp/libplacebo-install
          key: libplacebo-v7.360.1-${{ runner.os }}

      - name: Build libplacebo
        if: steps.cache-libplacebo.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v7.360.1 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo
          cd /tmp/libplacebo
          git submodule update --init --depth 1
          meson setup build -Dvulkan=disabled -Ddemos=false --prefix=/tmp/libplacebo-install
          ninja -C build
          ninja -C build install

      - name: Install libplacebo
        run: |
          sudo cp -a /tmp/libplacebo-install/. /usr/
          sudo ldconfig

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpv-linux
          create-symlink: true

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.so.2.5.0 out/
          ln -sf libmpv.so.2.5.0 out/libmpv.so.2
          ln -sf libmpv.so.2 out/libmpv.so

          # Ubuntu's libplacebo is too old, so bundle the one we built from source.
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for f in out/*.so*; do
              [ -L "$f" ] && continue
              for dep in $(ldd "$f" 2>/dev/null | awk '/=> \// {print $3}'); do
                base="$(basename "$dep")"
                if [[ "$base" == libplacebo* ]] && [ ! -e "out/$base" ]; then
                  cp -L "$dep" "out/$base"
                  added=$((added + 1))
                fi
              done
            done
          done

          # rpath so libmpv finds the bundled libplacebo regardless of caller's env.
          patchelf --set-rpath '$ORIGIN' out/libmpv.so.2.5.0

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-linux-x86_64
          path: out/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config ffmpeg libass libplacebo dylibbundler

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.2.dylib out/libmpv.dylib
          # Bundle Homebrew's dynamic deps so this works outside this machine.
          dylibbundler --bundle-deps --fix-file out/libmpv.dylib \
            --dest-dir out/ --install-path @rpath/ --overwrite-files

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-macos-universal
          path: out/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-lua51

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp build/mpv-2.dll out/ 2>/dev/null || cp build/libmpv-2.dll out/mpv-2.dll
          # Bundle MSYS2's dynamic deps; loop since ldd only lists direct ones.
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for f in out/*.dll; do
              for dep in $(ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'); do
                base="$(basename "$dep")"
                if [ ! -f "out/$base" ]; then
                  cp "$dep" "out/$base"
                  added=$((added + 1))
                fi
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-windows-x86_64
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's output
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
