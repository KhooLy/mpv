name: Build libmpv (gpu-next render backend)

on:
  push:
    branches: [gpu-next-render-backend]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # Pinned to match fluxa-desktop's own Linux CI, so apt's FFmpeg sonames agree.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config python3-pip \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libass-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libxext-dev \
            libvulkan-dev libplacebo-dev

      - name: Check libplacebo version, build from source if too old
        run: |
          if ! pkg-config --atleast-version=7.349.0 libplacebo; then
            git clone --depth 1 --branch v7.360.1 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo
            cd /tmp/libplacebo
            git submodule update --init --depth 1
            meson setup build -Dvulkan=disabled -Ddemos=false --prefix=/usr
            sudo ninja -C build install
          fi

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.so.2.5.0 out/
          ln -sf libmpv.so.2.5.0 out/libmpv.so.2
          ln -sf libmpv.so.2 out/libmpv.so

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-linux-x86_64
          path: out/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja pkg-config ffmpeg libass libplacebo dylibbundler

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp -L build/libmpv.2.dylib out/libmpv.dylib
          # Homebrew's ffmpeg/libass/libplacebo are dynamic; bundle them and
          # rewrite paths to @rpath so the dylib works outside this machine.
          dylibbundler --bundle-deps --fix-file out/libmpv.dylib \
            --dest-dir out/ --install-path @rpath/ --overwrite-files

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-macos-universal
          path: out/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo

      - name: Build mpv
        run: |
          meson setup build -Dlibmpv=true -Dgpl=false
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp build/mpv-2.dll out/ 2>/dev/null || cp build/libmpv-2.dll out/mpv-2.dll
          # Unlike shinchiro's static build, MSYS2's ffmpeg/libass packages are
          # shared libs -- mpv-2.dll alone won't run outside an MSYS2 environment.
          # ldd only lists direct deps, so loop until no new DLLs turn up.
          added=1
          while [ "$added" -ne 0 ]; do
            added=0
            for f in out/*.dll; do
              for dep in $(ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'); do
                base="$(basename "$dep")"
                if [ ! -f "out/$base" ]; then
                  cp "$dep" "out/$base"
                  added=$((added + 1))
                fi
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-windows-x86_64
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's output
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
